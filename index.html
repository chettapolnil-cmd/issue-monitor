<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Issue Monitor</title>

  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#142033;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#2563eb;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,"Noto Sans Thai",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:1500px;
      margin:auto;
      padding:20px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:center;
      margin-bottom:18px;
    }

    h1{
      margin:0;
      font-size:28px;
    }

    .sub{
      color:var(--muted);
      font-size:14px;
      margin-top:4px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(6,minmax(130px,1fr));
      gap:12px;
      margin-bottom:16px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      box-shadow:0 3px 10px rgba(15,23,42,.04);
    }

    .metric-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .metric{
      font-size:28px;
      font-weight:700;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:14px;
      background:white;
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
    }

    input,select,textarea,button{
      font:inherit;
    }

    input,select,textarea{
      border:1px solid #cbd5e1;
      border-radius:8px;
      padding:9px 10px;
      background:white;
    }

    button{
      border:0;
      border-radius:8px;
      padding:9px 12px;
      cursor:pointer;
      font-weight:700;
    }

    .primary{
      background:var(--blue);
      color:#fff;
    }

    .secondary{
      background:#eef2ff;
      color:#1e40af;
    }

    .table-card{
      background:white;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:auto;
    }

    table{
      border-collapse:collapse;
      width:100%;
      min-width:1220px;
    }

    th,td{
      padding:11px 10px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:top;
      font-size:13px;
    }

    th{
      background:#f8fafc;
      position:sticky;
      top:0;
      z-index:1;
    }

    .status{
      display:inline-flex;
      padding:5px 8px;
      border-radius:999px;
      font-weight:700;
      font-size:12px;
    }

    .NEW{color:#991b1b;background:#fee2e2}
    .IN_PROGRESS{color:#92400e;background:#fef3c7}
    .WAITING{color:#075985;background:#e0f2fe}
    .RESOLVED{color:#166534;background:#dcfce7}

    .progress-wrap{min-width:140px}

    .progress-row{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .bar{
      height:8px;
      background:#e5e7eb;
      border-radius:999px;
      flex:1;
      overflow:hidden;
    }

    .bar > div{
      height:100%;
      background:#2563eb;
    }

    .issue-text{
      max-width:360px;
      white-space:normal;
      line-height:1.45;
    }

    .actions{
      display:flex;
      gap:5px;
      flex-wrap:wrap;
    }

    .action{
      padding:6px 8px;
      font-size:11px;
    }

    .a-progress{background:#fef3c7;color:#92400e}
    .a-wait{background:#e0f2fe;color:#075985}
    .a-done{background:#dcfce7;color:#166534}

    .modal-bg{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:20;
    }

    .modal{
      width:min(600px,100%);
      background:white;
      border-radius:16px;
      padding:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .field{
      margin-bottom:12px;
    }

    label{
      display:block;
      font-weight:700;
      font-size:13px;
      margin-bottom:5px;
    }

    textarea{
      width:100%;
      min-height:80px;
      resize:vertical;
    }

    .field input,.field select{
      width:100%;
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:15px;
    }

    .login{
      max-width:430px;
      margin:80px auto;
    }

    .login input{
      width:100%;
      margin:12px 0;
    }

    .hidden{display:none!important}

    .empty{
      padding:40px;
      text-align:center;
      color:var(--muted);
    }

    @media(max-width:1000px){
      .cards{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:600px){
      .wrap{padding:10px}
      .cards{grid-template-columns:1fr 1fr}
      .header{align-items:flex-start;flex-direction:column}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

  <div id="loginView" class="login card">
    <h2>Issue Monitor</h2>
    <div class="sub">กรอกรหัส Admin เพื่อเข้าสู่ Dashboard</div>
    <input id="adminKey" type="password" placeholder="Admin Key">
    <button class="primary" onclick="login()">เข้าสู่ระบบ</button>
    <div id="loginMsg" class="sub" style="margin-top:10px"></div>
  </div>

  <div id="appView" class="wrap hidden">
    <div class="header">
      <div>
        <h1>ISSUE MONITOR</h1>
        <div class="sub">ติดตามปัญหาและความคืบหน้าแบบ Real-time</div>
      </div>

      <div>
        <button class="secondary" onclick="loadIssues()">Refresh</button>
        <button class="secondary" onclick="logout()">ออกจากระบบ</button>
      </div>
    </div>

    <div class="cards">
      <div class="card"><div class="metric-label">ทั้งหมด</div><div class="metric" id="mTotal">0</div></div>
      <div class="card"><div class="metric-label">🔴 NEW</div><div class="metric" id="mNew">0</div></div>
      <div class="card"><div class="metric-label">🟡 IN PROGRESS</div><div class="metric" id="mProgress">0</div></div>
      <div class="card"><div class="metric-label">🔵 WAITING</div><div class="metric" id="mWaiting">0</div></div>
      <div class="card"><div class="metric-label">🟢 RESOLVED</div><div class="metric" id="mResolved">0</div></div>
      <div class="card"><div class="metric-label">ความคืบหน้าเฉลี่ย</div><div class="metric" id="mAverage">0%</div></div>
    </div>

    <div class="toolbar">
      <select id="filterStatus" onchange="render()">
        <option value="">ทุกสถานะ</option>
        <option value="NEW">NEW</option>
        <option value="IN_PROGRESS">IN PROGRESS</option>
        <option value="WAITING">WAITING</option>
        <option value="RESOLVED">RESOLVED</option>
      </select>

      <input
        id="searchBox"
        placeholder="ค้นหา กลุ่ม / USER / ผู้แจ้ง / ปัญหา"
        oninput="render()"
        style="min-width:300px"
      >

      <select id="filterGroup" onchange="render()">
        <option value="">ทุกกลุ่ม</option>
      </select>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>เวลา</th>
            <th>กลุ่ม</th>
            <th>USER</th>
            <th>ผู้แจ้ง</th>
            <th>ปัญหา</th>
            <th>Priority</th>
            <th>สถานะ</th>
            <th>Progress</th>
            <th>ผู้รับผิดชอบ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="issueBody"></tbody>
      </table>

      <div id="emptyState" class="empty hidden">
        ไม่พบรายการ
      </div>
    </div>
  </div>

  <div id="modalBg" class="modal-bg">
    <div class="modal">
      <h3 style="margin-top:0">อัปเดต Issue</h3>

      <input type="hidden" id="editId">

      <div class="grid">
        <div class="field">
          <label>สถานะ</label>
          <select id="editStatus">
            <option value="NEW">NEW</option>
            <option value="IN_PROGRESS">IN PROGRESS</option>
            <option value="WAITING">WAITING</option>
            <option value="RESOLVED">RESOLVED</option>
          </select>
        </div>

        <div class="field">
          <label>Progress (%)</label>
          <input id="editProgress" type="number" min="0" max="100">
        </div>
      </div>

      <div class="field">
        <label>ผู้รับผิดชอบ</label>
        <input id="editAssigned" placeholder="ชื่อ Admin / ทีม">
      </div>

      <div class="field">
        <label>เหตุผลที่รอ</label>
        <input id="editWaiting" placeholder="กรณี WAITING">
      </div>

      <div class="field">
        <label>หมายเหตุ</label>
        <textarea id="editNote" placeholder="รายละเอียดการดำเนินการ"></textarea>
      </div>

      <div class="modal-actions">
        <button class="secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="primary" onclick="saveIssue()">บันทึก</button>
      </div>
    </div>
  </div>

<script>
  const API_BASE =
    "https://ubbsavvrophkbntnklso.supabase.co/functions/v1/issue-dashboard";

  let adminKey =
    sessionStorage.getItem("dashboardKey") || "";

  let issues = [];

  function escapeHtml(v){
    return String(v ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function timeTH(v){
    if(!v) return "-";

    return new Intl.DateTimeFormat("th-TH",{
      timeZone:"Asia/Bangkok",
      day:"2-digit",
      month:"2-digit",
      year:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      hourCycle:"h23"
    }).format(new Date(v));
  }

  async function api(path, options={}){
    const headers = {
      ...(options.headers || {}),
      "X-Dashboard-Key": adminKey
    };

    if(options.body){
      headers["Content-Type"] = "application/json";
    }

    const res = await fetch(API_BASE + path,{
      ...options,
      headers
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(data.message || "Request failed");
    }

    return data;
  }

  async function login(){
    const key =
      document.getElementById("adminKey").value.trim();

    if(!key) return;

    adminKey = key;

    try{
      await api("?api=issues");

      sessionStorage.setItem(
        "dashboardKey",
        adminKey
      );

      showApp();
      await loadIssues();

    }catch(err){
      document.getElementById("loginMsg").textContent =
        "รหัสไม่ถูกต้อง หรือ API ติดต่อไม่ได้";
      adminKey = "";
    }
  }

  function logout(){
    sessionStorage.removeItem("dashboardKey");
    adminKey = "";
    location.reload();
  }

  function showApp(){
    document.getElementById("loginView")
      .classList.add("hidden");

    document.getElementById("appView")
      .classList.remove("hidden");
  }

  async function loadIssues(){
    try{
      const data = await api("?api=issues");
      issues = data.issues || [];
      updateGroups();
      render();
    }catch(err){
      if(String(err.message).includes("Unauthorized")){
        logout();
        return;
      }

      alert(err.message);
    }
  }

  function updateGroups(){
    const sel =
      document.getElementById("filterGroup");

    const current = sel.value;

    const groups =
      [...new Set(
        issues
          .map(x => x.group_name)
          .filter(Boolean)
      )]
      .sort((a,b)=>a.localeCompare(b,"th"));

    sel.innerHTML =
      '<option value="">ทุกกลุ่ม</option>' +
      groups.map(g =>
        '<option value="' +
        escapeHtml(g) +
        '">' +
        escapeHtml(g) +
        '</option>'
      ).join("");

    if(groups.includes(current)){
      sel.value = current;
    }
  }

  function updateMetrics(){
    const total = issues.length;

    const n =
      issues.filter(x => x.status === "NEW").length;

    const p =
      issues.filter(x => x.status === "IN_PROGRESS").length;

    const w =
      issues.filter(x => x.status === "WAITING").length;

    const r =
      issues.filter(x => x.status === "RESOLVED").length;

    const avg =
      total
        ? Math.round(
            issues.reduce(
              (s,x) => s + Number(x.progress_percent || 0),
              0
            ) / total
          )
        : 0;

    document.getElementById("mTotal").textContent = total;
    document.getElementById("mNew").textContent = n;
    document.getElementById("mProgress").textContent = p;
    document.getElementById("mWaiting").textContent = w;
    document.getElementById("mResolved").textContent = r;
    document.getElementById("mAverage").textContent = avg + "%";
  }

  function render(){
    updateMetrics();

    const status =
      document.getElementById("filterStatus").value;

    const group =
      document.getElementById("filterGroup").value;

    const q =
      document.getElementById("searchBox")
        .value
        .trim()
        .toLowerCase();

    const rows = issues.filter(x => {
      if(status && x.status !== status) return false;
      if(group && x.group_name !== group) return false;

      if(q){
        const hay = [
          x.group_name,
          x.reported_user,
          x.sender_name,
          x.summary,
          x.assigned_to,
          x.admin_note
        ]
        .join(" ")
        .toLowerCase();

        if(!hay.includes(q)) return false;
      }

      return true;
    });

    const body =
      document.getElementById("issueBody");

    body.innerHTML =
      rows.map(function(x){
        const progress =
          Number(x.progress_percent || 0);

        return (
          '<tr>' +
            '<td>' + escapeHtml(timeTH(x.reported_at || x.created_at)) + '</td>' +
            '<td>' + escapeHtml(x.group_name || "-") + '</td>' +
            '<td>' + escapeHtml(x.reported_user || "⚠️ ไม่ระบุ") + '</td>' +
            '<td>' + escapeHtml(x.sender_name || "-") + '</td>' +
            '<td class="issue-text">' + escapeHtml(x.summary || "-") + '</td>' +
            '<td>' + escapeHtml(x.priority || "-") + '</td>' +
            '<td><span class="status ' + escapeHtml(x.status || "NEW") + '">' +
              escapeHtml(x.status || "NEW") +
            '</span></td>' +
            '<td class="progress-wrap">' +
              '<div class="progress-row">' +
                '<div class="bar"><div style="width:' + progress + '%"></div></div>' +
                '<b>' + progress + '%</b>' +
              '</div>' +
            '</td>' +
            '<td>' + escapeHtml(x.assigned_to || "-") + '</td>' +
            '<td><div class="actions">' +
              '<button class="action a-progress" onclick="quickStatus(' + x.id + ',\'IN_PROGRESS\')">รับเรื่อง</button>' +
              '<button class="action a-wait" onclick="quickStatus(' + x.id + ',\'WAITING\')">รอ</button>' +
              '<button class="action a-done" onclick="quickStatus(' + x.id + ',\'RESOLVED\')">✓ เสร็จ</button>' +
              '<button class="action secondary" onclick="openModal(' + x.id + ')">แก้ไข</button>' +
            '</div></td>' +
          '</tr>'
        );
      }).join("");

    document.getElementById("emptyState")
      .classList.toggle("hidden", rows.length !== 0);
  }

  async function quickStatus(id,status){
    const item = issues.find(x => x.id === id);
    if(!item) return;

    let progress = Number(item.progress_percent || 0);

    if(status === "IN_PROGRESS" && progress <= 0){
      progress = 10;
    }

    if(status === "WAITING" && progress >= 100){
      progress = 90;
    }

    if(status === "RESOLVED"){
      progress = 100;
    }

    await updateOne({
      id,
      status,
      progress_percent: progress,
      assigned_to: item.assigned_to || "",
      waiting_reason: item.waiting_reason || "",
      admin_note: item.admin_note || "",
      resolved_by: item.assigned_to || "ADMIN"
    });
  }

  function openModal(id){
    const item = issues.find(x => x.id === id);
    if(!item) return;

    document.getElementById("editId").value = item.id;
    document.getElementById("editStatus").value =
      item.status || "NEW";
    document.getElementById("editProgress").value =
      Number(item.progress_percent || 0);
    document.getElementById("editAssigned").value =
      item.assigned_to || "";
    document.getElementById("editWaiting").value =
      item.waiting_reason || "";
    document.getElementById("editNote").value =
      item.admin_note || "";

    document.getElementById("modalBg")
      .style.display = "flex";
  }

  function closeModal(){
    document.getElementById("modalBg")
      .style.display = "none";
  }

  async function saveIssue(){
    const id =
      Number(document.getElementById("editId").value);

    const status =
      document.getElementById("editStatus").value;

    let progress =
      Number(document.getElementById("editProgress").value);

    if(status === "RESOLVED") progress = 100;
    if(status === "NEW") progress = 0;

    await updateOne({
      id,
      status,
      progress_percent: progress,
      assigned_to:
        document.getElementById("editAssigned").value.trim(),
      waiting_reason:
        document.getElementById("editWaiting").value.trim(),
      admin_note:
        document.getElementById("editNote").value.trim(),
      resolved_by:
        document.getElementById("editAssigned").value.trim() || "ADMIN"
    });

    closeModal();
  }

  async function updateOne(payload){
    try{
      await api("?api=update",{
        method:"POST",
        body:JSON.stringify(payload)
      });

      await loadIssues();

    }catch(err){
      alert(err.message);
    }
  }

  if(adminKey){
    showApp();
    loadIssues();
  }
</script>

</body>
</html>
