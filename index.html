<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issue Monitor</title>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#fff;
    --text:#142033;
    --muted:#6b7280;
    --line:#e5e7eb;
    --blue:#2563eb;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,"Noto Sans Thai",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{max-width:1600px;margin:auto;padding:22px}
  .header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:14px
  }
  h1{margin:0;font-size:28px}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  button,select,input{font:inherit}
  button{
    border:0;border-radius:9px;padding:9px 12px;
    cursor:pointer;font-weight:700
  }
  .secondary{background:#eef2ff;color:#1e40af}
  .toolbar{
    display:flex;gap:9px;flex-wrap:wrap;
    padding:12px;background:#fff;border:1px solid var(--line);
    border-radius:14px;margin-bottom:14px
  }
  input,select{
    border:1px solid #cbd5e1;border-radius:8px;
    background:#fff;padding:9px 10px
  }
  .search{min-width:320px}
  .table-card{
    background:#fff;border:1px solid var(--line);
    border-radius:14px;overflow:auto
  }
  table{width:100%;border-collapse:collapse;min-width:1250px}
  th,td{
    padding:11px 10px;border-bottom:1px solid var(--line);
    text-align:left;vertical-align:top;font-size:13px
  }
  th{
    background:#f8fafc;position:sticky;top:0;z-index:1
  }
  .issue{max-width:430px;line-height:1.45}
  .status{
    display:inline-block;border-radius:999px;padding:5px 8px;
    font-weight:700;font-size:11px
  }
  .NEW{background:#fee2e2;color:#991b1b}
  .IN_PROGRESS{background:#fef3c7;color:#92400e}
  .WAITING{background:#e0f2fe;color:#075985}
  .RESOLVED{background:#dcfce7;color:#166534}
  .cell-select{min-width:145px;width:100%}
  .login{
    max-width:430px;margin:80px auto;padding:22px;background:#fff;
    border:1px solid var(--line);border-radius:16px
  }
  .login input{width:100%;margin:12px 0}
  .primary{background:var(--blue);color:#fff}
  .hidden{display:none!important}
  .empty{text-align:center;color:var(--muted);padding:35px}
  .live{font-size:12px;color:#16a34a;font-weight:700}
  @media(max-width:700px){
    .wrap{padding:10px}
    .header{align-items:flex-start;flex-direction:column}
    .search{min-width:100%;width:100%}
  }
</style>
</head>

<body>
<div id="loginView" class="login">
  <h2>Issue Monitor</h2>
  <div class="sub">กรอกรหัส Admin เพื่อเข้าสู่ Dashboard</div>
  <input id="adminKey" type="password" placeholder="Admin Key">
  <button class="primary" onclick="login()">เข้าสู่ระบบ</button>
  <div id="loginMsg" class="sub" style="margin-top:10px"></div>
</div>

<div id="appView" class="wrap hidden">
  <div class="header">
    <div>
      <h1>ISSUE MONITOR</h1>
      <div class="sub">ติดตามปัญหาจาก LINE</div>
    </div>
    <div>
      <span class="live">● Auto refresh 10s</span>
      <button class="secondary" onclick="loadAll()">Refresh</button>
      <button class="secondary" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <div class="toolbar">
    <select id="filterStatus" onchange="render()">
      <option value="">ทุกสถานะ</option>
      <option value="NEW">NEW</option>
      <option value="IN_PROGRESS">IN PROGRESS</option>
      <option value="WAITING">WAITING</option>
      <option value="RESOLVED">RESOLVED</option>
    </select>

    <input id="searchBox" class="search"
      placeholder="ค้นหา กลุ่ม / SUP / USER / ผู้แจ้ง / ปัญหา"
      oninput="render()">

    <select id="filterGroup" onchange="render()">
      <option value="">ทุกกลุ่ม</option>
    </select>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>เวลา</th>
          <th>กลุ่ม</th>
          <th>SUP</th>
          <th>USER</th>
          <th>ผู้แจ้ง</th>
          <th>ปัญหา</th>
          <th>สถานะ</th>
          <th>ผู้รับผิดชอบ</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="issueBody"></tbody>
    </table>
    <div id="emptyState" class="empty hidden">ไม่พบรายการ</div>
  </div>
</div>

<script>
const API_BASE =
  "https://ubbsavvrophkbntnklso.supabase.co/functions/v1/issue-dashboard";

let adminKey = sessionStorage.getItem("dashboardKey") || "";
let issues = [];
let assignees = [];

function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function timeTH(v){
  if(!v) return "-";
  return new Intl.DateTimeFormat("th-TH",{
    timeZone:"Asia/Bangkok",
    day:"2-digit",
    month:"2-digit",
    year:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    hourCycle:"h23"
  }).format(new Date(v));
}

async function api(path,options={}){
  const headers = {
    ...(options.headers || {}),
    "X-Dashboard-Key":adminKey
  };

  if(options.body){
    headers["Content-Type"]="application/json";
  }

  const res = await fetch(API_BASE + path,{
    ...options,
    headers
  });

  const data = await res.json();

  if(!res.ok){
    throw new Error(data.message || "Request failed");
  }

  return data;
}

async function login(){
  const key = document.getElementById("adminKey").value.trim();
  if(!key) return;

  adminKey = key;

  try{
    await api("?api=issues");
    sessionStorage.setItem("dashboardKey",adminKey);
    showApp();
    await loadAll();
  }catch(err){
    adminKey="";
    document.getElementById("loginMsg").textContent =
      "รหัสไม่ถูกต้อง หรือ API ติดต่อไม่ได้";
  }
}

function logout(){
  sessionStorage.removeItem("dashboardKey");
  location.reload();
}

function showApp(){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
}

async function loadAll(){
  try{
    const [issueData,assigneeData] = await Promise.all([
      api("?api=issues"),
      api("?api=assignees")
    ]);

    issues = issueData.issues || [];
    assignees = assigneeData.assignees || [];

    updateGroups();
    render();
  }catch(err){
    if(String(err.message).includes("Unauthorized")){
      logout();
      return;
    }
    console.error(err);
  }
}

function updateGroups(){
  const sel = document.getElementById("filterGroup");
  const current = sel.value;

  const groups = [...new Set(
    issues.map(x=>x.group_name).filter(Boolean)
  )].sort((a,b)=>a.localeCompare(b,"th"));

  sel.innerHTML =
    '<option value="">ทุกกลุ่ม</option>' +
    groups.map(g =>
      '<option value="' + escapeHtml(g) + '">' +
      escapeHtml(g) + '</option>'
    ).join("");

  if(groups.includes(current)){
    sel.value=current;
  }
}

function assigneeOptions(selected){
  let html = '<option value="">-</option>';

  assignees.forEach(a=>{
    const sel = a.name === selected ? " selected" : "";
    html += '<option value="' + escapeHtml(a.name) + '"' + sel + '>' +
      escapeHtml(a.name) + '</option>';
  });

  html += '<option value="__ADD__">➕ เพิ่มชื่อ</option>';
  return html;
}

function actionOptions(){
  return (
    '<option value="">เลือก</option>' +
    '<option value="IN_PROGRESS">รับเรื่อง</option>' +
    '<option value="WAITING">รอ</option>' +
    '<option value="RESOLVED">✓ เสร็จแล้ว</option>' +
    '<option value="NEW">กลับเป็น NEW</option>'
  );
}

function render(){
  const status=document.getElementById("filterStatus").value;
  const group=document.getElementById("filterGroup").value;
  const q=document.getElementById("searchBox").value.trim().toLowerCase();

  const rows=issues.filter(x=>{
    if(status && x.status!==status) return false;
    if(group && x.group_name!==group) return false;

    if(q){
      const hay=[
        x.group_name,
        x.sup_name,
        x.reported_user,
        x.sender_name,
        x.summary,
        x.assigned_to
      ].join(" ").toLowerCase();

      if(!hay.includes(q)) return false;
    }

    return true;
  });

  const body=document.getElementById("issueBody");

  body.innerHTML=rows.map(function(x){
    return (
      '<tr>' +
        '<td>' + escapeHtml(timeTH(x.reported_at || x.created_at)) + '</td>' +
        '<td>' + escapeHtml(x.group_name || "-") + '</td>' +
        '<td>' + escapeHtml(x.sup_name || "⚠️ ไม่ระบุ") + '</td>' +
        '<td>' + escapeHtml(x.reported_user || "⚠️ ไม่ระบุ") + '</td>' +
        '<td>' + escapeHtml(x.sender_name || "-") + '</td>' +
        '<td class="issue">' + escapeHtml(x.summary || "-") + '</td>' +
        '<td><span class="status ' + escapeHtml(x.status || "NEW") + '">' +
          escapeHtml(x.status || "NEW") + '</span></td>' +
        '<td>' +
          '<select class="cell-select" onchange="changeAssignee(' +
            x.id + ',this)">' +
            assigneeOptions(x.assigned_to || "") +
          '</select>' +
        '</td>' +
        '<td>' +
          '<select class="cell-select" onchange="changeAction(' +
            x.id + ',this)">' +
            actionOptions() +
          '</select>' +
        '</td>' +
      '</tr>'
    );
  }).join("");

  document.getElementById("emptyState")
    .classList.toggle("hidden",rows.length!==0);
}

async function changeAssignee(id,select){
  const item=issues.find(x=>x.id===id);
  if(!item) return;

  let value=select.value;

  if(value==="__ADD__"){
    const name=prompt("เพิ่มชื่อผู้รับผิดชอบ");
    if(!name || !name.trim()){
      select.value=item.assigned_to || "";
      return;
    }

    const data=await api("?api=assignee-add",{
      method:"POST",
      body:JSON.stringify({name:name.trim()})
    });

    value=data.assignee.name;
    await loadAll();
  }

  await updateIssue({
    id:item.id,
    status:item.status || "NEW",
    assigned_to:value
  });
}

async function changeAction(id,select){
  const item=issues.find(x=>x.id===id);
  if(!item) return;

  const status=select.value;
  select.value="";

  if(!status) return;

  await updateIssue({
    id:item.id,
    status,
    assigned_to:item.assigned_to || ""
  });
}

async function updateIssue(payload){
  try{
    await api("?api=update",{
      method:"POST",
      body:JSON.stringify(payload)
    });
    await loadAll();
  }catch(err){
    alert(err.message);
  }
}

if(adminKey){
  showApp();
  loadAll();
}

setInterval(()=>{
  if(adminKey){
    loadAll();
  }
},10000);
</script>
</body>
</html>
